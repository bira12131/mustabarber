<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto - MustaBarber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="../tema-claro.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #141414 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .form-card {
            background: rgba(25, 25, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 20px rgba(26, 26, 26, 0.3);
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .form-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-back {
            background: rgba(45, 45, 50, 0.8);
            color: #e8e8e8;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            color: #fff;
            box-shadow: 0 4px 12px rgba(150, 150, 170, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 150, 170, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(45, 45, 50, 0.8);
            color: #e8e8e8;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: #e8e8e8;
            margin-bottom: 0.5rem;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 0.25rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(45, 45, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #e8e8e8;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e8e8e8;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #86776a;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Upload de Imagem */
        .image-upload-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .image-preview-area {
            width: 100%;
            max-width: 300px;
            height: 300px;
            margin: 0 auto 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: rgba(45, 45, 50, 0.5);
            transition: all 0.3s;
        }

        .image-preview-area:hover {
            border-color: #e8e8e8;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-placeholder {
            text-align: center;
            color: #86776a;
        }

        .image-placeholder i {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            display: block;
            color: rgba(255, 255, 255, 0.3);
        }

        .image-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        #removeImageBtn {
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        /* Mensagens */
        .message {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
            align-items: center;
            gap: 0.75rem;
        }

        .message.show {
            display: flex;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        /* Form Actions */
        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .form-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .form-header h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <div class="form-header">
                <h1><i class="fas fa-box"></i> <span id="formTitle">Cadastrar Produto</span></h1>
                <a href="produtos.html" class="btn btn-back">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>

            <div id="messageContainer" class="message">
                <i class="fas fa-check-circle"></i>
                <span id="messageText"></span>
            </div>

            <form id="productForm">
                <input type="hidden" id="codigo" name="codigo">

                <!-- Upload de Imagem -->
                <div class="form-section">
                    <div class="section-title">
                        <i class="fas fa-image"></i> Foto do Produto
                    </div>
                    <div class="image-upload-container">
                        <div class="image-preview-area">
                            <img id="imagePreview" alt="Pr&eacute;-visualiza&ccedil;&atilde;o">
                            <div id="imagePlaceholder" class="image-placeholder">
                                <i class="fas fa-box"></i>
                                <p>Adicione uma foto do produto</p>
                                <small>JPG, PNG ou GIF (m&aacute;x. 5MB)</small>
                            </div>
                        </div>
                        <input type="file" id="foto" name="foto" accept="image/*">
                        <div class="image-actions">
                            <label for="foto" class="btn btn-secondary">
                                <i class="fas fa-upload"></i> Escolher Imagem
                            </label>
                            <button type="button" id="removeImageBtn" class="btn btn-secondary" onclick="removeImage()">
                                <i class="fas fa-trash"></i> Remover
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Informa&ccedil;&otilde;es B&aacute;sicas -->
                <div class="form-section">
                    <div class="section-title">
                        <i class="fas fa-info-circle"></i> Informa&ccedil;&otilde;es B&aacute;sicas
                    </div>

                    <div class="form-group">
                        <label for="nome">Nome do Produto<span class="required">*</span></label>
                        <input type="text" id="nome" name="nome" placeholder="Ex: Pomada Modeladora" required>
                    </div>

                    <div class="form-group">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" name="marca" placeholder="Ex: Barba Forte">
                    </div>
                </div>

                <!-- Pre&ccedil;o e Estoque -->
                <div class="form-section">
                    <div class="section-title">
                        <i class="fas fa-dollar-sign"></i> Pre&ccedil;o e Estoque
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preco">Pre&ccedil;o (R$)<span class="required">*</span></label>
                            <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="0.00" required>
                        </div>

                        <div class="form-group">
                            <label for="quantidade_estoque">Quantidade em Estoque<span class="required">*</span></label>
                            <input type="number" id="quantidade_estoque" name="quantidade_estoque" min="0" placeholder="0" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="status">Status<span class="required">*</span></label>
                        <select id="status" name="status" required>
                            <option value="1">Ativo</option>
                            <option value="0">Inativo</option>
                        </select>
                    </div>
                </div>

                <!-- Bot&otilde;es de A&ccedil;&atilde;o -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='produtos.html'">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> Salvar Produto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let editingProductId = null;

        // Preview de imagem
        document.getElementById('foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Validar tamanho (5MB)
                if (file.size > 5 * 1024 * 1024) {
                    showNotification('A imagem deve ter no m&aacute;ximo 5MB', 'error');
                    e.target.value = '';
                    return;
                }

                // Validar tipo
                const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
                if (!validTypes.includes(file.type)) {
                    showNotification('Formato inv&aacute;lido. Use JPG, PNG ou GIF', 'error');
                    e.target.value = '';
                    return;
                }

                previewImage(file);
            }
        });

        function previewImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                const placeholder = document.getElementById('imagePlaceholder');
                const removeBtn = document.getElementById('removeImageBtn');
                
                preview.src = e.target.result;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                removeBtn.style.display = 'inline-flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            const removeBtn = document.getElementById('removeImageBtn');
            const fileInput = document.getElementById('foto');
            
            preview.src = '';
            preview.style.display = 'none';
            placeholder.style.display = 'block';
            removeBtn.style.display = 'none';
            fileInput.value = '';
        }

        // Submiss&atilde;o do formul&aacute;rio
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            
            try {
                const formData = new FormData();
                
                // Adicionar campos do formul&aacute;rio
                if (editingProductId) {
                    formData.append('codigo', editingProductId);
                }
                formData.append('nome', document.getElementById('nome').value);
                formData.append('marca', document.getElementById('marca').value);
                formData.append('preco', document.getElementById('preco').value);
                formData.append('quantidade_estoque', document.getElementById('quantidade_estoque').value);
                formData.append('status', document.getElementById('status').value);
                
                // Adicionar imagem se houver
                const fotoInput = document.getElementById('foto');
                if (fotoInput.files.length > 0) {
                    formData.append('foto', fotoInput.files[0]);
                }
                
                const response = await fetch('../../bancodedados/produtos/cadastro_produto.php', {
                    method: 'POST',
                    body: formData
                });
                
                // Verificar se a resposta ? OK
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status} - Verifique se o arquivo PHP existe no caminho correto`);
                }
                
                const data = await response.json();
                
                if (data.sucesso) {
                    showNotification(editingProductId ? 'Produto atualizado com sucesso!' : 'Produto cadastrado com sucesso!', 'success');
                    setTimeout(() => {
                        window.location.href = 'produtos.html';
                    }, 1500);
                } else {
                    throw new Error(data.mensagem || 'Erro ao salvar produto');
                }
                
            } catch (error) {
                console.error('Erro ao salvar produto:', error);
                showNotification(error.message || 'Erro ao salvar produto', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Notifica&ccedil;&atilde;o
        function showNotification(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.notification');
            if (existing) {
                existing.remove();
            }
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.cssText = `
                position: fixed;
                top: 1rem;
                right: 1rem;
                background: rgba(26, 24, 22, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(212, 165, 116, 0.3);
                border-left: 4px solid ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#d4a574'};
                color: #f5f1ed;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                z-index: 10001;
                max-width: 300px;
                animation: slideInRight 0.3s ease-in-out;
            `;
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease-in-out';
                setTimeout(() => notification.remove(), 300);
            }, duration);
        }

        // Carregar dados do produto para edi&ccedil;&atilde;o
        async function loadProductData(codigo) {
            try {
                const response = await fetch(`../../bancodedados/produtos/listar_produtos.php?codigo=${codigo}`);
                
                if (!response.ok) {
                    throw new Error('Erro na requisi&ccedil;&atilde;o');
                }
                
                const data = await response.json();
                
                if (data.sucesso && data.produtos && data.produtos.length > 0) {
                    const produto = data.produtos[0];
                    
                    document.getElementById('nome').value = produto.nome || '';
                    document.getElementById('marca').value = produto.marca || '';
                    document.getElementById('preco').value = produto.preco || '';
                    document.getElementById('quantidade_estoque').value = produto.quantidade_estoque || '';
                    document.getElementById('status').value = produto.status || '1';
                    
                    if (produto.foto_caminho) {
                        const preview = document.getElementById('imagePreview');
                        const placeholder = document.getElementById('imagePlaceholder');
                        const removeBtn = document.getElementById('removeImageBtn');
                        
                        preview.src = '../../' + produto.foto_caminho;
                        preview.style.display = 'block';
                        placeholder.style.display = 'none';
                        removeBtn.style.display = 'inline-flex';
                    }
                } else {
                    showNotification(data.mensagem || 'Produto n&atilde;o encontrado', 'error');
                }
            } catch (error) {
                console.error('Erro ao carregar dados do produto:', error);
                showNotification('Erro ao carregar dados do produto', 'error');
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigo = urlParams.get('codigo');
            
            if (codigo) {
                editingProductId = codigo;
                document.getElementById('formTitle').textContent = 'Editar Produto';
                document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Atualizar Produto';
                loadProductData(codigo);
            }
        });

        // Adicionar anima&ccedil;&otilde;es CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
    
    <script>
        // Aplicar tema salvo ao carregar p&#65533;gina
        (function() {
            const temaSalvo = localStorage.getItem('tema');
            if (temaSalvo === 'claro') {
                document.body.classList.add('tema-claro');
            }
        })();
    </script>
</body>
</html>
