<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Agendamento - MustaBarber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../tema-claro.css" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: transparent;
            color: #e8e8e8;
            min-height: 100vh;
            padding: 1.25rem;
        }

        /* ── TOAST ── */
        #toast-container {
            position: fixed; top: 1rem; right: 1rem; z-index: 9999;
            display: flex; flex-direction: column; gap: .4rem;
        }
        .toast {
            display: flex; align-items: center; gap: .65rem;
            padding: .75rem 1.1rem; border-radius: 10px; font-size: .84rem;
            font-weight: 500; min-width: 240px; max-width: 340px;
            backdrop-filter: blur(10px); border-left: 3px solid;
            animation: slideIn .25s ease-out;
        }
        .toast.success { background: rgba(16,185,129,.15); border-color: #10b981; color: #34d399; }
        .toast.error   { background: rgba(239,68,68,.15);  border-color: #ef4444; color: #f87171; }
        .toast.info    { background: rgba(59,130,246,.15); border-color: #3b82f6; color: #60a5fa; }
        @keyframes slideIn { from { transform: translateX(110%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── LAYOUT ── */
        .container { max-width: 720px; margin: 0 auto; }

        .page-topbar {
            display: flex; align-items: center; margin-bottom: 1rem;
        }
        .btn-voltar {
            display: inline-flex; align-items: center; gap: .5rem;
            padding: .6rem .9rem;
            background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px; color: #9ca3af; font-size: .82rem; font-weight: 600;
            text-decoration: none; transition: all .18s;
        }
        .btn-voltar:hover { background: rgba(255,255,255,.11); color: #e8e8e8; }

        /* ── CARD WRAPPER ── */
        .card {
            background: rgba(22,22,26,.9);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 1.25rem;
            display: flex; flex-direction: column; gap: 1rem;
        }

        /* ── SEÇÃO ── */
        .section {
            background: rgba(255,255,255,.025);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 14px;
            padding: 1rem 1.1rem;
        }
        .section-title {
            display: flex; align-items: center; gap: .6rem;
            font-size: .82rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: .06em; color: #6b7280; margin-bottom: .85rem;
        }
        .section-title i {
            width: 26px; height: 26px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 7px; background: rgba(255,255,255,.07);
            color: #a78bfa; font-size: .75rem; flex-shrink: 0;
        }

        /* ── FORM ── */
        .form-group { margin-bottom: .75rem; }
        .form-group:last-child { margin-bottom: 0; }
        .form-group label {
            display: block; font-size: .78rem; font-weight: 600;
            color: #9ca3af; margin-bottom: .35rem;
        }
        .required { color: #ef4444; }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: .7rem .9rem;
            color: #e8e8e8;
            font-size: .875rem;
            font-family: 'Inter', sans-serif;
            transition: border-color .18s, background .18s;
        }
        .form-group input:not([type="checkbox"]),
        .form-group select { height: 44px; }
        /* Fix definitivo para input[type=date] no mobile (Android/iOS) */
        .form-group input[type="date"] {
            height: 44px !important;
            min-height: 44px !important;
            max-height: 44px !important;
            -webkit-appearance: none;
            appearance: none;
            line-height: 1;
            padding-top: 0;
            padding-bottom: 0;
            display: flex;
            align-items: center;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            background: rgba(255,255,255,.075);
            border-color: rgba(99,102,241,.5);
            box-shadow: 0 0 0 3px rgba(99,102,241,.12);
        }
        .form-group select:disabled { opacity: .5; cursor: not-allowed; }
        .form-group textarea { resize: vertical; min-height: 80px; height: auto; }

        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
        }
        /* mantém 2 colunas mesmo em mobile */
        .form-row-inline {
            display: grid; grid-template-columns: 1fr 1fr; gap: .75rem;
            align-items: start;
        }

        /* ── BUSCA CLIENTE ── */
        .busca-cliente-container { position: relative; }
        .resultado-busca {
            position: absolute; top: calc(100% + 2px); left: 0; right: 0;
            background: rgba(20,20,24,.98);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            max-height: 260px; overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }
        .item-cliente {
            padding: .7rem .9rem;
            border-bottom: 1px solid rgba(255,255,255,.06);
            cursor: pointer; transition: background .15s;
        }
        .item-cliente:last-child { border-bottom: none; }
        .item-cliente:hover { background: rgba(255,255,255,.07); }
        .item-cliente-nome { font-size: .84rem; font-weight: 600; color: #e8e8e8; }
        .item-cliente-telefone { font-size: .76rem; color: #6b7280; margin-top: .1rem; }

        /* ── CLIENTE SELECIONADO ── */
        .cliente-selecionado {
            display: flex; align-items: center; justify-content: space-between; gap: .75rem;
            background: rgba(99,102,241,.08);
            border: 1px solid rgba(99,102,241,.2);
            border-radius: 10px; padding: .7rem .9rem;
            margin-bottom: .75rem;
        }
        .cliente-selecionado.bloqueado-aviso {
            background: rgba(239,68,68,.08);
            border-color: rgba(239,68,68,.3);
        }
        .cliente-selecionado-info { flex: 1; min-width: 0; }
        .cliente-selecionado-nome { font-size: .84rem; font-weight: 600; color: #e8e8e8; }
        .cliente-selecionado-telefone { font-size: .76rem; color: #a78bfa; margin-top: .1rem; }
        .btn-limpar-cliente {
            flex-shrink: 0;
            background: rgba(255,255,255,.06); color: #9ca3af;
            border: 1px solid rgba(255,255,255,.1);
            padding: .35rem .65rem; border-radius: 7px;
            cursor: pointer; font-size: .75rem; font-family: inherit;
            transition: background .15s;
        }
        .btn-limpar-cliente:hover { background: rgba(255,255,255,.12); color: #e8e8e8; }

        /* ── SERVIÇOS ── */
        .servicos-grid { display: flex; flex-direction: column; gap: .5rem; }
        .servico-card {
            display: flex; align-items: center; gap: .75rem;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px; padding: .75rem .9rem;
            cursor: pointer; transition: all .18s;
            user-select: none;
        }
        .servico-card:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
        .servico-card.checked {
            background: rgba(99,102,241,.1);
            border-color: rgba(99,102,241,.35);
        }
        .servico-card input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1; cursor: pointer; flex-shrink: 0;
        }
        .servico-info { flex: 1; min-width: 0; }
        .servico-nome { font-size: .84rem; font-weight: 600; color: #e8e8e8; }
        .servico-duracao { font-size: .75rem; color: #6b7280; margin-top: .1rem; }
        .servico-preco { font-size: .9rem; font-weight: 700; color: #a78bfa; flex-shrink: 0; }

        /* ── RESUMO SERVIÇOS ── */
        .resumo {
            margin-top: .75rem;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 10px; overflow: hidden;
        }
        .resumo-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: .55rem .9rem; font-size: .82rem; color: #9ca3af;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .resumo-item:last-of-type { border-bottom: none; }
        .resumo-total {
            display: flex; justify-content: space-between; align-items: center;
            padding: .65rem .9rem;
            border-top: 1px solid rgba(255,255,255,.08);
            font-size: .88rem; font-weight: 700; color: #e8e8e8;
            background: rgba(255,255,255,.03);
        }
        .resumo-total span:last-child { color: #a78bfa; }

        /* ── LOADING ── */
        .loading {
            text-align: center; padding: 1.5rem;
            color: #6b7280; font-size: .84rem;
        }

        /* ── AGENDAMENTO FIXO ── */
        .fixo-toggle {
            display: flex; align-items: center; gap: .7rem;
            padding: .7rem .9rem;
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 10px;
            cursor: pointer; user-select: none;
            transition: all .18s; margin-top: .5rem;
        }
        .fixo-toggle:hover { background: rgba(255,255,255,.06); }
        .fixo-toggle.ativo {
            background: rgba(99,102,241,.1);
            border-color: rgba(99,102,241,.3);
        }
        .fixo-toggle input[type="checkbox"] {
            width: 16px; height: 16px;
            accent-color: #6366f1; cursor: pointer; flex-shrink: 0;
        }
        .fixo-toggle-label {
            flex: 1; font-size: .84rem; font-weight: 600; color: #9ca3af;
            display: flex; align-items: center; gap: .45rem;
        }
        .fixo-toggle.ativo .fixo-toggle-label { color: #a78bfa; }
        .fixo-toggle-label i { font-size: .8rem; }

        /* ── ENCAIXE ── */
        .encaixe-toggle { margin-top: .5rem; }
        .encaixe-toggle.ativo { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); }
        .encaixe-toggle.ativo .fixo-toggle-label { color: #fbbf24; }
        .encaixe-time-wrap { display: none; margin-top: .6rem; }
        .encaixe-time-wrap.ativo { display: block; animation: fadeUp .2s ease-out; }
        .encaixe-time-wrap select {
            width: 100%; padding: .65rem .9rem;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(245,158,11,.4);
            border-radius: 10px; color: #fbbf24;
            font-size: .9rem; font-weight: 600;
            font-family: inherit; cursor: pointer;
            appearance: none; -webkit-appearance: none;
        }
        .encaixe-time-wrap select:focus { outline: none; border-color: #fbbf24; }
        .encaixe-time-wrap select option { background: #1a1a1e; color: #fbbf24; }

        .recorrente-opcoes { display: none; margin-top: .75rem; }
        .recorrente-opcoes.ativo { display: block; animation: fadeUp .2s ease-out; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .duracao-grid {
            display: flex; gap: .5rem; flex-wrap: wrap;
            margin-bottom: .65rem;
        }
        .duracao-opcao {
            flex: 1; min-width: 60px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: .15rem; padding: .6rem .4rem;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 9px;
            cursor: pointer; transition: all .18s;
            font-family: inherit;
        }
        .duracao-opcao:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }
        .duracao-opcao.selecionado {
            background: rgba(99,102,241,.15);
            border-color: rgba(99,102,241,.4);
        }
        .duracao-opcao .numero {
            font-size: 1.05rem; font-weight: 700; color: #e8e8e8; line-height: 1;
        }
        .duracao-opcao.selecionado .numero { color: #a78bfa; }
        .duracao-opcao .texto { font-size: .65rem; color: #6b7280; font-weight: 500; }
        .duracao-opcao.selecionado .texto { color: #7c85fa; }

        .resumo-recorrente {
            display: none;
            background: rgba(99,102,241,.08);
            border: 1px solid rgba(99,102,241,.2);
            border-radius: 9px; padding: .6rem .9rem;
            font-size: .8rem; color: #a78bfa; font-weight: 500;
        }
        .resumo-recorrente.ativo { display: flex; align-items: center; gap: .5rem; }

        /* ── HORÁRIO STATUS COLORS ── */
        #horarioAgendamento option.horario-disponivel { color: #34d399; }
        #horarioAgendamento option.horario-bloqueado  { color: #f87171; }
        #horarioAgendamento option.horario-agendado   { color: #60a5fa; }

        .alerta-encaixe {
            display: none;
            margin-top: .6rem;
            padding: .7rem .85rem;
            border-radius: 10px;
            border: 1px solid rgba(245,158,11,.35);
            background: rgba(245,158,11,.10);
            color: #fcd34d;
            font-size: .8rem;
            line-height: 1.35;
        }
        .alerta-encaixe.ativo {
            display: flex;
            align-items: flex-start;
            gap: .5rem;
            animation: fadeUp .2s ease-out;
        }

        /* ── ACTIONS ── */
        .actions {
            display: flex; gap: .65rem;
            padding-top: .25rem;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
            padding: .75rem 1.25rem;
            border: none; border-radius: 10px;
            font-size: .84rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            transition: all .18s;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; transform: none !important; }
        .btn-secondary {
            flex: 0 0 auto;
            background: rgba(255,255,255,.06);
            color: #9ca3af;
            border: 1px solid rgba(255,255,255,.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,.11); color: #e8e8e8; }
        .btn-primary {
            flex: 1;
            background: rgba(99,102,241,.2);
            color: #a78bfa;
            border: 1px solid rgba(99,102,241,.35);
        }
        .btn-primary:hover { background: rgba(99,102,241,.3); border-color: rgba(99,102,241,.5); }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.6);
            display: none; align-items: center; justify-content: center;
            z-index: 10000; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; animation: fadeIn .22s ease; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal-custom {
            background: rgba(22,22,26,.98);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px; padding: 1.5rem;
            max-width: 380px; width: calc(100% - 2rem);
            box-shadow: 0 24px 60px rgba(0,0,0,.5);
            animation: slideUpModal .22s ease-out;
        }
        @keyframes slideUpModal { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .modal-header-custom {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1rem;
        }
        .modal-title {
            display: flex; align-items: center; gap: .5rem;
            font-size: 1rem; font-weight: 700; color: #e8e8e8;
        }
        .modal-close {
            background: none; border: none; color: #6b7280;
            font-size: 1rem; cursor: pointer; padding: .25rem;
            transition: color .15s;
        }
        .modal-close:hover { color: #e8e8e8; }
        .modal-body-custom p {
            text-align: center; font-size: .9rem; color: #9ca3af;
        }
        .modal-footer-custom {
            margin-top: 1.25rem; display: flex; gap: .6rem;
        }
        .modal-footer-custom .btn { flex: 1; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            body { padding: .85rem; }
            .form-row { grid-template-columns: 1fr; gap: 0; }
            .form-row-inline { grid-template-columns: 1fr 1fr; gap: .5rem; }
            .actions { flex-direction: column; }
            .btn-secondary { order: 2; }
            .btn-primary { order: 1; }
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="container">
        <div class="page-topbar">
            <a href="agendamentos.html" class="btn-voltar" id="btnVoltarPagina">
                <i class="fas fa-arrow-left"></i>
                Voltar
            </a>
        </div>

        <form id="formAgendamento" class="card">

            <!-- ── CLIENTE ── -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-user"></i>
                    Cliente
                </h2>

                <!-- busca autocomplete -->
                <div class="form-group">
                    <label>Buscar cliente existente</label>
                    <div class="busca-cliente-container">
                        <input type="text" id="buscaCliente"
                               placeholder="Digite o nome (mín. 3 letras)" autocomplete="off">
                        <div id="resultadoBuscaCliente" class="resultado-busca" style="display:none;"></div>
                    </div>
                </div>

                <!-- cliente selecionado via busca (oculto por padrão) -->
                <input type="hidden" id="codClienteSelecionado" value="">

                <!-- campos manuais -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Nome <span class="required">*</span></label>
                        <input type="text" id="nomeCliente" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone <span class="required">*</span></label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" inputmode="tel" required>
                    </div>
                </div>
            </div>

            <!-- ── DATA E HORÁRIO ── -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-calendar"></i>
                    Data e Hor&aacute;rio
                </h2>
                <div class="form-row-inline">
                    <div class="form-group">
                        <label>Data <span class="required">*</span></label>
                        <input type="date" id="dataAgendamento" required>
                    </div>
                    <div class="form-group">
                        <label>Hor&aacute;rio <span class="required">*</span></label>
                        <select id="horarioAgendamento" required disabled>
                            <option value="">Selecione a data...</option>
                        </select>
                        <div id="alertaEncaixeSobreposicao" class="alerta-encaixe">
                            <i class="fas fa-exclamation-triangle" style="margin-top:.05rem"></i>
                            <span id="alertaEncaixeTexto"></span>
                        </div>
                    </div>
                </div>

                <!-- toggle encaixe -->
                <div class="fixo-toggle encaixe-toggle" id="encaixeToggle" onclick="toggleEncaixe()">
                    <input type="checkbox" id="checkEncaixe" onchange="toggleEncaixe()">
                    <span class="fixo-toggle-label">
                        <i class="fas fa-bolt"></i>
                        Encaixe (hor&aacute;rio fora da agenda)
                    </span>
                </div>

                <div class="fixo-toggle" id="retroativoToggle" onclick="toggleRetroativo()">
                    <input type="checkbox" id="checkRetroativo" onchange="toggleRetroativo()">
                    <span class="fixo-toggle-label">
                        <i class="fas fa-history"></i>
                        Lan&ccedil;amento retroativo (datas/hor&aacute;rios passados)
                    </span>
                </div>
                <!-- campo de hora livre para encaixe -->
                <div class="encaixe-time-wrap" id="encaixeTimeWrap">
                    <select id="horarioEncaixe">
                        <option value="">Selecione a data primeiro...</option>
                    </select>
                </div>

                <!-- toggle agendamento fixo -->
                <div class="fixo-toggle" id="fixoToggle" onclick="toggleAgendamentoRecorrente()">
                    <input type="checkbox" id="checkAgendamentoFixo" onchange="toggleAgendamentoRecorrente()">
                    <span class="fixo-toggle-label">
                        <i class="fas fa-repeat"></i>
                        Agendamento fixo (semanal)
                    </span>
                </div>

                <!-- opções de recorrência -->
                <div class="recorrente-opcoes" id="opcoesRecorrente">
                    <div class="form-group" style="margin-bottom:.5rem">
                        <label>Quantas semanas? <span class="required">*</span></label>
                        <div class="duracao-grid">
                            <button type="button" class="duracao-opcao" data-semanas="4"  onclick="selecionarDuracao(4)">
                                <span class="numero">4</span><span class="texto">semanas</span>
                            </button>
                            <button type="button" class="duracao-opcao" data-semanas="8"  onclick="selecionarDuracao(8)">
                                <span class="numero">8</span><span class="texto">semanas</span>
                            </button>
                            <button type="button" class="duracao-opcao" data-semanas="12" onclick="selecionarDuracao(12)">
                                <span class="numero">12</span><span class="texto">semanas</span>
                            </button>
                            <button type="button" class="duracao-opcao" data-semanas="26" onclick="selecionarDuracao(26)">
                                <span class="numero">26</span><span class="texto">semanas</span>
                            </button>
                            <button type="button" class="duracao-opcao" data-semanas="52" onclick="selecionarDuracao(52)">
                                <span class="numero">52</span><span class="texto">semanas</span>
                            </button>
                        </div>
                        <input type="hidden" id="duracaoSemanas" value="">
                    </div>
                    <div class="resumo-recorrente" id="resumoRecorrente">
                        <i class="fas fa-calendar-check"></i>
                        <span id="textoResumoRecorrente"></span>
                    </div>
                </div>
            </div>

            <!-- ── SERVIÇOS ── -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-scissors"></i>
                    Servi&ccedil;os
                </h2>
                <div class="servicos-grid" id="servicosGrid">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        Carregando servi&ccedil;os...
                    </div>
                </div>
                <div class="resumo" id="resumoBox">
                    <div id="resumoServicos"></div>
                    <div class="resumo-total">
                        <span>Total</span>
                        <span id="valorTotal">R$ 0,00</span>
                    </div>
                </div>
            </div>

            <!-- ── OBSERVAÇÕES ── -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-comment-dots"></i>
                    Observa&ccedil;&otilde;es
                </h2>
                <div class="form-group">
                    <textarea id="observacoes" placeholder="Alguma observa&ccedil;&atilde;o? (opcional)"></textarea>
                </div>
            </div>

            <!-- ── AÇÕES ── -->
            <div class="actions">
                <button type="button" class="btn btn-secondary" id="btnCancelarAgendamento">
                    <i class="fas fa-times"></i>
                    Cancelar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i>
                    Confirmar Agendamento
                </button>
            </div>

        </form>
    </div>

    <!-- Modal de Sucesso -->
    <div class="modal-overlay" id="modalSucesso">
        <div class="modal-custom">
            <div class="modal-header-custom">
                <h2 class="modal-title">
                    <i class="fas fa-check-circle" style="color:#10b981"></i>
                    <span id="modal-sucesso-titulo">Sucesso!</span>
                </h2>
                <button class="modal-close" onclick="fecharModalSucesso()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-custom">
                <p id="modal-sucesso-mensagem"></p>
            </div>
            <div class="modal-footer-custom">
                <button type="button" class="btn btn-primary" onclick="fecharModalSucesso()">
                    <i class="fas fa-check"></i> OK
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Erro -->
    <div class="modal-overlay" id="modalErro">
        <div class="modal-custom">
            <div class="modal-header-custom">
                <h2 class="modal-title">
                    <i class="fas fa-exclamation-triangle" style="color:#ef4444"></i>
                    <span id="modal-erro-titulo">Erro</span>
                </h2>
                <button class="modal-close" onclick="fecharModalErro()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-custom">
                <p id="modal-erro-mensagem"></p>
            </div>
            <div class="modal-footer-custom">
                <button type="button" class="btn btn-secondary" onclick="fecharModalErro()">
                    <i class="fas fa-times"></i> Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmacao de Horario Bloqueado -->
    <div class="modal-overlay" id="modalConfirmacaoHorarioBloqueado">
        <div class="modal-custom">
            <div class="modal-header-custom">
                <h2 class="modal-title">
                    <i class="fas fa-exclamation-circle" style="color:#f59e0b"></i>
                    <span id="modal-confirmacao-titulo">Confirmar Agendamento</span>
                </h2>
                <button class="modal-close" onclick="responderConfirmacaoHorarioBloqueado(false)"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body-custom">
                <p id="modal-confirmacao-mensagem"></p>
            </div>
            <div class="modal-footer-custom">
                <button type="button" class="btn btn-secondary" onclick="responderConfirmacaoHorarioBloqueado(false)">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
                <button type="button" class="btn btn-primary" onclick="responderConfirmacaoHorarioBloqueado(true)">
                    <i class="fas fa-check"></i> Confirmar Agendamento
                </button>
            </div>
        </div>
    </div>

    <script>
        const pageParams = new URLSearchParams(window.location.search);
        const origemPagina = pageParams.get('origem') || '';
        const dataPrefill = pageParams.get('data') || '';
        const horarioPrefill = pageParams.get('horario') || '';
        const codBarbeiroPrefill = pageParams.get('cod_barbeiro') || '';
        let horarioPreferido = /^\d{2}:\d{2}$/.test(horarioPrefill) ? horarioPrefill : '';

        function getReturnPageUrl() {
            if (origemPagina === 'agenda') {
                const params = new URLSearchParams();
                if (codBarbeiroPrefill) {
                    params.set('cod_barbeiro', codBarbeiroPrefill);
                }
                const query = params.toString();
                return query ? `agenda-visualizacao.html?${query}` : 'agenda-visualizacao.html';
            }

            return 'agendamentos.html';
        }

        function setupReturnNavigation() {
            const returnUrl = getReturnPageUrl();
            const btnVoltar = document.getElementById('btnVoltarPagina');
            const btnCancelar = document.getElementById('btnCancelarAgendamento');

            if (btnVoltar) {
                btnVoltar.href = returnUrl;
            }

            if (btnCancelar) {
                btnCancelar.addEventListener('click', function() {
                    window.location.href = returnUrl;
                });
            }
        }

        // ── TOAST ──
        function toast(msg, tipo = 'info') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const icon = tipo === 'success' ? 'fa-check-circle' : tipo === 'error' ? 'fa-times-circle' : 'fa-info-circle';
            t.className = 'toast ' + tipo;
            t.innerHTML = `<i class="fas ${icon}"></i><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // ── MODAIS ──
        function abrirModalSucesso(mensagem, titulo = 'Sucesso!') {
            document.getElementById('modal-sucesso-titulo').textContent = titulo;
            document.getElementById('modal-sucesso-mensagem').textContent = mensagem;
            document.getElementById('modalSucesso').classList.add('show');
        }
        function fecharModalSucesso() {
            document.getElementById('modalSucesso').classList.remove('show');
            window.location.href = getReturnPageUrl();
        }
        function abrirModalErro(mensagem, titulo = 'Erro') {
            document.getElementById('modal-erro-titulo').textContent = titulo;
            document.getElementById('modal-erro-mensagem').textContent = mensagem;
            document.getElementById('modalErro').classList.add('show');
        }
        function fecharModalErro() {
            document.getElementById('modalErro').classList.remove('show');
        }
        let resolveConfirmacaoHorarioBloqueado = null;
        function abrirModalConfirmacaoHorarioBloqueado(mensagem, titulo = 'Confirmar Agendamento') {
            document.getElementById('modal-confirmacao-titulo').textContent = titulo;
            document.getElementById('modal-confirmacao-mensagem').textContent = mensagem;
            document.getElementById('modalConfirmacaoHorarioBloqueado').classList.add('show');

            return new Promise((resolve) => {
                resolveConfirmacaoHorarioBloqueado = resolve;
            });
        }
        function responderConfirmacaoHorarioBloqueado(confirmou) {
            document.getElementById('modalConfirmacaoHorarioBloqueado').classList.remove('show');
            if (typeof resolveConfirmacaoHorarioBloqueado === 'function') {
                resolveConfirmacaoHorarioBloqueado(confirmou);
                resolveConfirmacaoHorarioBloqueado = null;
            }
        }
        document.addEventListener('click', function(e) {
            if (e.target.id === 'modalSucesso') fecharModalSucesso();
            else if (e.target.id === 'modalErro') fecharModalErro();
            else if (e.target.id === 'modalConfirmacaoHorarioBloqueado') responderConfirmacaoHorarioBloqueado(false);
        });

        // Carregar servi&#65533;os
        async function carregarServicos() {
            try {
                // Buscar apenas os servi&ccedil;os do barbeiro logado
                let url = '../../bancodedados/servicos/listar_servicos.php';
                if (window.parent && window.parent.usuarioLogado && window.parent.usuarioLogado.codigo) {
                    url += '?codigo_barbeiro=' + window.parent.usuarioLogado.codigo;
                }
                
                const response = await fetch(url);
                const data = await response.json();
                
                const grid = document.getElementById('servicosGrid');
                
                if (data.sucesso && data.servicos.length > 0) {
                    grid.innerHTML = '';
                    data.servicos.forEach(servico => {
                        const card = document.createElement('label');
                        card.className = 'servico-card';
                        card.innerHTML = `
                            <input type="checkbox" name="servicos" value="${servico.codigo}" 
                                   data-preco="${servico.preco}" data-nome="${servico.nome}" data-duracao="${servico.duracao || 30}">
                            <div class="servico-info">
                                <div class="servico-nome">${servico.nome}</div>
                                <div class="servico-duracao"><i class="fas fa-clock" style="font-size:.7rem;margin-right:.25rem"></i>${servico.duracao} min</div>
                            </div>
                            <div class="servico-preco">R$ ${servico.preco.toFixed(2).replace('.', ',')}</div>
                        `;
                        grid.appendChild(card);
                    });
                    
                    document.querySelectorAll('input[name="servicos"]').forEach(cb => {
                        cb.addEventListener('change', function() {
                            this.closest('.servico-card').classList.toggle('checked', this.checked);
                            atualizarResumo();
                            atualizarAlertaEncaixeSobreposicao();
                        });
                    });
                } else {
                    grid.innerHTML = '<div class="loading">Nenhum servi&ccedil;o dispon&iacute;vel.</div>';
                }
            } catch (erro) {
                console.error(erro);
                document.getElementById('servicosGrid').innerHTML = 
                    '<div class="loading" style="color:#ef4444;">Erro ao carregar servi&ccedil;os.</div>';
            }
        }

        // Atualizar resumo
        function atualizarResumo() {
            const checkboxes = document.querySelectorAll('input[name="servicos"]:checked');
            const resumo = document.getElementById('resumoServicos');
            let total = 0;
            let html = '';
            
            checkboxes.forEach(cb => {
                const preco = parseFloat(cb.dataset.preco);
                const nome = cb.dataset.nome;
                total += preco;
                html += `<div class="resumo-item"><span>${nome}</span><span>R$ ${preco.toFixed(2).replace('.', ',')}</span></div>`;
            });
            
            resumo.innerHTML = html || '<div class="resumo-item" style="justify-content: center; color: #e8e8e8;">Nenhum servi&ccedil;o selecionado</div>';
            document.getElementById('valorTotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function obterDuracaoTotalSelecionada() {
            const checkboxes = document.querySelectorAll('input[name="servicos"]:checked');
            let total = 0;
            checkboxes.forEach(cb => {
                total += parseInt(cb.dataset.duracao || '30', 10) || 30;
            });
            return total;
        }

        function atualizarAlertaEncaixeSobreposicao() {
            const alerta = document.getElementById('alertaEncaixeSobreposicao');
            const texto = document.getElementById('alertaEncaixeTexto');
            const encaixeAtivo = document.getElementById('checkEncaixe').checked;
            const opt = document.querySelector('#horarioAgendamento option:checked');

            alerta.classList.remove('ativo');
            texto.textContent = '';

            if (encaixeAtivo || !opt || !opt.value) {
                return;
            }

            const status = opt.dataset.status || '';
            const minutosAteProximoRaw = opt.dataset.minutosAteProximo;
            const minutosAteProximo = minutosAteProximoRaw === '' || minutosAteProximoRaw === undefined
                ? null
                : Number(minutosAteProximoRaw);
            const duracaoTotal = obterDuracaoTotalSelecionada();

            if (status === 'agendado') {
                texto.textContent = 'Atenção: este horário já possui atendimento e será um encaixe com sobreposição. Confirme apenas se estiver ciente.';
                alerta.classList.add('ativo');
                return;
            }

            if (duracaoTotal > 0 && minutosAteProximo !== null && duracaoTotal > minutosAteProximo) {
                texto.textContent = `Atenção: a duração total dos serviços (${duracaoTotal} min) sobrepõe o próximo compromisso deste horário.`;
                alerta.classList.add('ativo');
            }
        }

        // Carregar hor&#65533;rios dispon&#65533;veis com status
        document.getElementById('dataAgendamento').addEventListener('change', async function(e) {
            const data = e.target.value;
            const select = document.getElementById('horarioAgendamento');
            
            if (!data) {
                select.disabled = true;
                select.innerHTML = '<option value="">Selecione a data primeiro...</option>';
                return;
            }
            
            // Validar se o ano n&atilde;o come&ccedil;a com 0 (data inv&aacute;lida ou incompleta)
            const ano = data.split('-')[0];
            if (ano.startsWith('0')) {
                select.disabled = true;
                select.innerHTML = '<option value="">Data inv&aacute;lida...</option>';
                return;
            }
            
            try {
                select.disabled = true;
                select.innerHTML = '<option value="">Carregando...</option>';
                
                const retroativoAtivo = document.getElementById('checkRetroativo').checked;
                const response = await fetch(`../../bancodedados/agendamentos/buscar_horarios_dia.php?data=${data}&incluir_passados=${retroativoAtivo ? '1' : '0'}`);
                const result = await response.json();
                
                if (result.sucesso && result.horarios.length > 0) {
                    select.innerHTML = '<option value="">Selecione um hor&aacute;rio...</option>';
                    
                    result.horarios.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.horario;
                        option.textContent = item.horario;
                        option.dataset.status = item.status || '';
                        option.dataset.motivoBloqueio = item.motivo_bloqueio || '';
                        option.dataset.minutosAteProximo = (item.minutos_ate_proximo ?? '');
                        
                        // Aplica classe baseada no status
                        if (item.status === 'disponivel') {
                            option.className = 'horario-disponivel';
                        } else if (item.status === 'bloqueado') {
                            option.className = 'horario-bloqueado';
                            option.textContent = item.motivo_bloqueio === 'almoco'
                                ? `${item.horario} - Almo\u00e7o`
                                : `${item.horario} - Bloqueado`;
                        } else if (item.status === 'agendado') {
                            option.className = 'horario-agendado';
                            option.textContent = `${item.horario} - Agendado`;
                        }
                        
                        select.appendChild(option);
                    });
                    
                    select.disabled = false;

                    if (horarioPreferido) {
                        const opcaoPreferida = Array.from(select.options).find((option) => option.value === horarioPreferido && !option.disabled);
                        if (opcaoPreferida) {
                            select.value = horarioPreferido;
                        }
                        horarioPreferido = '';
                    }

                    atualizarAlertaEncaixeSobreposicao();
                } else {
                    select.innerHTML = '<option value="">Nenhum hor&aacute;rio dispon&iacute;vel</option>';
                    atualizarAlertaEncaixeSobreposicao();
                }
            } catch (erro) {
                console.error(erro);
                select.innerHTML = '<option value="">Erro ao carregar hor&aacute;rios</option>';
                atualizarAlertaEncaixeSobreposicao();
            }
        });

        document.getElementById('horarioAgendamento').addEventListener('change', atualizarAlertaEncaixeSobreposicao);

        // M&#65533;scara de telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length <= 11) {
                value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3');
                value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
                value = value.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            }
            e.target.value = value;
        });

        // Data m&#65533;nima
        const dataMinimaPadrao = new Date().toISOString().split('T')[0];
        document.getElementById('dataAgendamento').min = dataMinimaPadrao;

        function toggleRetroativo() {
            const checkbox = document.getElementById('checkRetroativo');
            const toggle = document.getElementById('retroativoToggle');
            const campoData = document.getElementById('dataAgendamento');

            if (checkbox.checked) {
                toggle.classList.add('ativo');
                campoData.min = '';
            } else {
                toggle.classList.remove('ativo');
                campoData.min = dataMinimaPadrao;
                if (campoData.value && campoData.value < dataMinimaPadrao) {
                    campoData.value = dataMinimaPadrao;
                }
            }

            if (campoData.value) {
                campoData.dispatchEvent(new Event('change'));
            }
        }

        // Preenchimento quando vem da agenda visual
        if (/^\d{4}-\d{2}-\d{2}$/.test(dataPrefill)) {
            const campoData = document.getElementById('dataAgendamento');
            campoData.value = dataPrefill;
            campoData.dispatchEvent(new Event('change'));
        }

        // Fun&ccedil;&otilde;es para Agendamento Recorrente
        function toggleAgendamentoRecorrente() {
            const checkbox = document.getElementById('checkAgendamentoFixo');
            const opcoes = document.getElementById('opcoesRecorrente');
            const toggle = document.getElementById('fixoToggle');
            
            if (checkbox.checked) {
                opcoes.classList.add('ativo');
                toggle.classList.add('ativo');
            } else {
                opcoes.classList.remove('ativo');
                toggle.classList.remove('ativo');
                document.getElementById('resumoRecorrente').classList.remove('ativo');
                document.getElementById('duracaoSemanas').value = '';
                document.querySelectorAll('.duracao-opcao').forEach(opcao => {
                    opcao.classList.remove('selecionado');
                });
            }
        }

        function selecionarDuracao(semanas) {
            document.querySelectorAll('.duracao-opcao').forEach(opcao => {
                opcao.classList.remove('selecionado');
            });
            
            document.querySelector(`.duracao-opcao[data-semanas="${semanas}"]`).classList.add('selecionado');
            document.getElementById('duracaoSemanas').value = semanas;
            
            const dataAgendamento = document.getElementById('dataAgendamento').value;
            if (dataAgendamento) {
                const dataInicio = new Date(dataAgendamento + 'T00:00:00');
                const dataFim = new Date(dataInicio);
                dataFim.setDate(dataFim.getDate() + (semanas * 7));
                
                const textoResumo = `${semanas} agendamentos semanais — de ${formatarData(dataInicio)} até ${formatarData(dataFim)}`;
                document.getElementById('textoResumoRecorrente').textContent = textoResumo;
                document.getElementById('resumoRecorrente').classList.add('ativo');
            }
        }

        function formatarData(data) {
            return data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ── ENCAIXE ──
        async function preencherHorariosEncaixe(data) {
            const selectEncaixe = document.getElementById('horarioEncaixe');
            selectEncaixe.innerHTML = '<option value="">Carregando...</option>';

            try {
                const resp = await fetch(`../../bancodedados/horarios/buscar_configuracoes.php?data=${data}`);
                const result = await resp.json();

                // Se não há expediente configurado no dia, não há encaixe possível
                const cfg = result.configuracao;
                if (!result.sucesso || !cfg || !cfg.horario_inicio || !cfg.horario_fim) {
                    selectEncaixe.innerHTML = '<option value="">Sem expediente neste dia</option>';
                    return;
                }

                const inicioMin = timeToMin(cfg.horario_inicio);
                const fimMin    = timeToMin(cfg.horario_fim);

                // Gera slots de 30 em 30 min fora do intervalo de expediente
                const slots = [];
                for (let m = 0; m < 24 * 60; m += 30) {
                    if (m < inicioMin || m >= fimMin) {
                        slots.push(minToTime(m));
                    }
                }

                if (slots.length === 0) {
                    selectEncaixe.innerHTML = '<option value="">Nenhum horário disponível</option>';
                    return;
                }

                selectEncaixe.innerHTML = '<option value="">Selecione um horário...</option>';
                slots.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    selectEncaixe.appendChild(opt);
                });
            } catch (e) {
                selectEncaixe.innerHTML = '<option value="">Erro ao carregar horários</option>';
            }
        }

        function timeToMin(t) {
            const [h, m] = String(t).substring(0, 5).split(':').map(Number);
            return h * 60 + m;
        }

        function minToTime(m) {
            const h = String(Math.floor(m / 60)).padStart(2, '0');
            const min = String(m % 60).padStart(2, '0');
            return `${h}:${min}`;
        }

        function toggleEncaixe() {
            const checkbox = document.getElementById('checkEncaixe');
            const toggle   = document.getElementById('encaixeToggle');
            const wrap     = document.getElementById('encaixeTimeWrap');
            const select   = document.getElementById('horarioAgendamento');

            if (checkbox.checked) {
                toggle.classList.add('ativo');
                wrap.classList.add('ativo');
                select.disabled = true;
                select.style.opacity = '.35';
                const data = document.getElementById('dataAgendamento').value;
                if (data) {
                    preencherHorariosEncaixe(data);
                } else {
                    document.getElementById('horarioEncaixe').innerHTML = '<option value="">Selecione a data primeiro...</option>';
                }
            } else {
                toggle.classList.remove('ativo');
                wrap.classList.remove('ativo');
                const data = document.getElementById('dataAgendamento').value;
                if (data) select.disabled = false;
                select.style.opacity = '';
            }

            atualizarAlertaEncaixeSobreposicao();
        }

        // Atualizar resumo quando a data mudar (se recorrente estiver ativo)
        // Também atualiza horários de encaixe se estiver ativo
        document.getElementById('dataAgendamento').addEventListener('change', function() {
            const data = this.value;
            const duracaoSemanas = document.getElementById('duracaoSemanas').value;
            if (duracaoSemanas && document.getElementById('checkAgendamentoFixo').checked) {
                selecionarDuracao(parseInt(duracaoSemanas));
            }
            if (data && document.getElementById('checkEncaixe').checked) {
                preencherHorariosEncaixe(data);
            }
        });

        // Busca e sele&#65533;&#65533;o de clientes
        let timeoutBusca = null;
        let clienteSelecionadoBloqueado = false;
        
        document.getElementById('buscaCliente').addEventListener('input', async function(e) {
            const termo = e.target.value.trim();
            const resultadoDiv = document.getElementById('resultadoBuscaCliente');
            
            // Limpar timeout anterior
            clearTimeout(timeoutBusca);
            
            // Se vazio, esconder resultados
            if (termo.length === 0) {
                resultadoDiv.style.display = 'none';
                return;
            }
            
            // Se menos de 3 caracteres, mostrar mensagem mas n&#65533;o buscar no servidor
            if (termo.length < 3) {
                resultadoDiv.innerHTML = '<div style="padding: 1rem; text-align: center; color: #a09a91; font-size: 0.9rem;">Digite pelo menos 3 letras para buscar</div>';
                resultadoDiv.style.display = 'block';
                return;
            }
            
            // Aguardar um pouco antes de fazer a requisi&#65533;&#65533;o (debounce)
            timeoutBusca = setTimeout(async () => {
                try {
                    const response = await fetch(`../../bancodedados/clientes/buscar_clientes_nome.php?termo=${encodeURIComponent(termo)}`);
                    const result = await response.json();
                    
                    if (result.sucesso && result.clientes.length > 0) {
                        let html = '';
                        result.clientes.forEach(cliente => {
                            html += `
                                <div class="item-cliente" data-codigo="${cliente.codigo}" data-nome="${cliente.nome}" data-telefone="${cliente.telefone}" data-bloqueado="${cliente.bloqueado ? '1' : '0'}">
                                    <div class="item-cliente-nome">${cliente.nome}${cliente.bloqueado ? ' <span style="color:#f87171;font-size:.7rem;font-weight:700"><i class=\'fas fa-ban\'></i> Bloqueado</span>' : ''}</div>
                                    <div class="item-cliente-telefone">${cliente.telefone}</div>
                                </div>
                            `;
                        });
                        resultadoDiv.innerHTML = html;
                        resultadoDiv.style.display = 'block';
                        
                        // Adicionar listeners aos itens
                        document.querySelectorAll('.item-cliente').forEach(item => {
                            item.addEventListener('click', function() {
                                selecionarCliente(
                                    this.dataset.codigo,
                                    this.dataset.nome,
                                    this.dataset.telefone,
                                    this.dataset.bloqueado === '1'
                                );
                            });
                        });
                    } else {
                        resultadoDiv.innerHTML = '<div style="padding: 1rem; text-align: center; color: #a09a91;">Nenhum cliente encontrado</div>';
                        resultadoDiv.style.display = 'block';
                    }

                } catch (erro) {
                    console.error('Erro ao buscar clientes:', erro);
                    resultadoDiv.innerHTML = '<div style="padding: 1rem; text-align: center; color: #ef4444;">Erro ao buscar clientes</div>';
                    resultadoDiv.style.display = 'block';
                }
            }, 300);
        });
        
        // Fechar dropdown ao clicar fora
        document.addEventListener('click', function(e) {
            const buscaCliente = document.getElementById('buscaCliente');
            const resultadoDiv = document.getElementById('resultadoBuscaCliente');
            
            if (e.target !== buscaCliente && !resultadoDiv.contains(e.target)) {
                resultadoDiv.style.display = 'none';
            }
        });
        
        // Selecionar cliente
        function selecionarCliente(codigo, nome, telefone, bloqueado = false) {
            // Preencher os campos
            document.getElementById('nomeCliente').value = nome;
            document.getElementById('telefone').value = telefone;
            document.getElementById('codClienteSelecionado').value = codigo;
            clienteSelecionadoBloqueado = bloqueado;
            
            // Mostrar badge do cliente selecionado
            let badge = document.getElementById('clienteSelecionadoBadge');
            if (!badge) {
                badge = document.createElement('div');
                badge.id = 'clienteSelecionadoBadge';
                badge.className = 'cliente-selecionado';
                const buscaGroup = document.getElementById('buscaCliente').closest('.form-group');
                buscaGroup.parentNode.insertBefore(badge, buscaGroup.nextSibling);
            }
            badge.className = 'cliente-selecionado' + (bloqueado ? ' bloqueado-aviso' : '');
            badge.innerHTML = `
                <div class="cliente-selecionado-info">
                    <div class="cliente-selecionado-nome"><i class="fas fa-user-check" style="margin-right:.4rem;color:${bloqueado ? '#f87171' : '#a78bfa'};font-size:.75rem"></i>${nome}</div>
                    <div class="cliente-selecionado-telefone" style="color:${bloqueado ? '#f87171' : ''}">${telefone}</div>
                </div>
                <button type="button" class="btn-limpar-cliente" onclick="limparCliente()">
                    <i class="fas fa-times" style="margin-right:.25rem"></i>Trocar
                </button>
            `;
            badge.style.display = 'flex';

            // Exibir modal de aviso se bloqueado
            if (bloqueado) {
                abrirModalErro('Este cliente está bloqueado e não pode realizar agendamentos. Desbloqueie-o na tela de Clientes antes de prosseguir.', 'Cliente Bloqueado');
            }
            
            // Limpar busca
            document.getElementById('buscaCliente').value = '';
            document.getElementById('resultadoBuscaCliente').style.display = 'none';
        }

        function limparCliente() {
            document.getElementById('codClienteSelecionado').value = '';
            document.getElementById('nomeCliente').value = '';
            document.getElementById('telefone').value = '';
            clienteSelecionadoBloqueado = false;
            const badge = document.getElementById('clienteSelecionadoBadge');
            if (badge) badge.style.display = 'none';
        }

        // Buscar ou cadastrar cliente
        async function buscarOuCadastrarCliente(nome, telefone) {
            // Remove formata&#65533;&#65533;o do telefone
            const telefoneNumeros = telefone.replace(/\D/g, '');
            
            // Buscar cliente por telefone
            const buscaResponse = await fetch('../../bancodedados/clientes/listar_clientes.php?busca=' + telefoneNumeros);
            const buscaResult = await buscaResponse.json();
            
            // Se encontrou o cliente, retorna o c&#65533;digo
            if (buscaResult.sucesso && buscaResult.clientes && buscaResult.clientes.length > 0) {
                return buscaResult.clientes[0].codigo;
            }
            
            // Se n&#65533;o encontrou, cadastra novo cliente
            const cadastroFormData = new FormData();
            cadastroFormData.append('nome', nome);
            cadastroFormData.append('telefone', telefoneNumeros);
            
            const cadastroResponse = await fetch('../../bancodedados/clientes/cadastro_cliente.php', {
                method: 'POST',
                body: cadastroFormData
            });
            const cadastroResult = await cadastroResponse.json();
            
            if (cadastroResult.sucesso) {
                return cadastroResult.codigo;
            } else {
                throw new Error(cadastroResult.mensagem || 'Erro ao cadastrar cliente');
            }
        }

        // Submiss&#65533;o
        document.getElementById('formAgendamento').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Bloquear envio se cliente estiver bloqueado
            if (clienteSelecionadoBloqueado) {
                abrirModalErro('Este cliente está bloqueado e não pode realizar agendamentos. Desbloqueie-o na tela de Clientes antes de prosseguir.', 'Cliente Bloqueado');
                return;
            }
            
            const servicosSelecionados = Array.from(document.querySelectorAll('input[name="servicos"]:checked'));
            if (servicosSelecionados.length === 0) {
                abrirModalErro('Selecione pelo menos um servi&#65533;o.', 'Aten&#65533;&#65533;o');
                return;
            }
            
            const btnSubmit = this.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...';
            
            try {
                let codCliente;
                const codClienteSelecionado = document.getElementById('codClienteSelecionado').value;
                
                // Se um cliente foi selecionado, usar o c&#65533;digo dele
                if (codClienteSelecionado) {
                    codCliente = codClienteSelecionado;
                } else {
                    // Caso contr&#65533;rio, buscar ou cadastrar cliente
                    const nomeCliente = document.getElementById('nomeCliente').value.trim();
                    const telefone = document.getElementById('telefone').value.trim();
                    
                    if (!nomeCliente || !telefone) {
                        throw new Error('Nome e telefone s&atilde;o obrigat&oacute;rios');
                    }
                    
                    codCliente = await buscarOuCadastrarCliente(nomeCliente, telefone);
                }
                
                // Verificar se &eacute; agendamento recorrente
                const isRecorrente = document.getElementById('checkAgendamentoFixo').checked;
                const duracaoSemanas = document.getElementById('duracaoSemanas').value;
                
                if (isRecorrente && !duracaoSemanas) {
                    throw new Error('Selecione a dura&ccedil;&atilde;o do agendamento fixo');
                }
                
                // Monta os dados do agendamento
                const dataAgendamento = document.getElementById('dataAgendamento').value;
                const encaixeAtivo = document.getElementById('checkEncaixe').checked;
                const horaFinal = encaixeAtivo
                    ? document.getElementById('horarioEncaixe').value
                    : document.getElementById('horarioAgendamento').value;
                if (!horaFinal) throw new Error('Informe o horário do agendamento.');
                let confirmouHorarioBloqueado = false;
                let confirmouEncaixe = false;
                let tentativasReenvioEncaixe = 0;

                while (true) {
                    const formData = new FormData();
                    formData.append('cod_cliente', codCliente);
                    formData.append('data_agendamento', dataAgendamento);
                    formData.append('hora_agendamento', horaFinal);
                    formData.append('observacoes', document.getElementById('observacoes').value);
                    formData.append('servicos', JSON.stringify(servicosSelecionados.map(cb => ({ codigo: cb.value }))));

                    if (confirmouEncaixe) {
                        formData.append('permitir_encaixe', '1');
                    }

                    // Adicionar dados de recorr&ecirc;ncia se aplic&aacute;vel
                    if (isRecorrente) {
                        formData.append('is_recorrente', '1');
                        formData.append('duracao_semanas', duracaoSemanas);
                    }

                    if (confirmouHorarioBloqueado) {
                        formData.append('confirmar_horario_bloqueado', '1');
                    }

                    const response = await fetch('../../bancodedados/agendamentos/cadastro_agendamento.php', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (result.sucesso) {
                        let mensagem = 'Agendamento realizado com sucesso!';
                        if (isRecorrente && result.agendamentos_criados) {
                            mensagem = `${result.agendamentos_criados} agendamentos fixos criados com sucesso!`;
                        }
                        abrirModalSucesso(mensagem, 'Sucesso!');
                        break;
                    }

                    if (result.requer_confirmacao_horario_bloqueado && !confirmouHorarioBloqueado) {
                        const confirmar = await abrirModalConfirmacaoHorarioBloqueado(
                            `${result.mensagem} Deseja confirmar e agendar mesmo assim?`,
                            'Horario Bloqueado'
                        );
                        if (!confirmar) {
                            btnSubmit.disabled = false;
                            btnSubmit.innerHTML = '<i class="fas fa-check"></i> Confirmar Agendamento';
                            return;
                        }
                        confirmouHorarioBloqueado = true;
                        continue;
                    }

                    const mensagemResultado = String(result.mensagem || '');
                    const requerConfirmacaoEncaixe = !!result.requer_confirmacao_encaixe ||
                        /deseja confirmar o encaixe/i.test(mensagemResultado);

                    if (requerConfirmacaoEncaixe && !confirmouEncaixe) {
                        const confirmarEncaixe = await abrirModalConfirmacaoHorarioBloqueado(
                            result.mensagem,
                            'Confirmar Encaixe'
                        );
                        if (!confirmarEncaixe) {
                            btnSubmit.disabled = false;
                            btnSubmit.innerHTML = '<i class="fas fa-check"></i> Confirmar Agendamento';
                            return;
                        }
                        confirmouEncaixe = true;
                        continue;
                    }

                    if (requerConfirmacaoEncaixe && confirmouEncaixe && tentativasReenvioEncaixe < 1) {
                        tentativasReenvioEncaixe++;
                        continue;
                    }

                    throw new Error(result.mensagem || 'Erro ao agendar.');
                }

            } catch (erro) {
                console.error(erro);
                abrirModalErro(erro.message || 'Erro ao processar agendamento', 'Erro');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-check"></i> Confirmar Agendamento';
            }
        });

        // Inicializar
        setupReturnNavigation();
        carregarServicos();
    </script>
    
    <script>
        // Aplicar tema salvo ao carregar p&#65533;gina
        (function() {
            const temaSalvo = localStorage.getItem('tema');
            if (temaSalvo === 'claro') {
                document.body.classList.add('tema-claro');
            }
        })();
    </script>
</body>
