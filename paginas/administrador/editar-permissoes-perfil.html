<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Permiss&otilde;es do Perfil - Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="../tema-claro.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #141414 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            background: rgba(25, 25, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-left p {
            color: #b0b0b0;
            font-size: 1rem;
        }

        .btn-back {
            background: rgba(212, 165, 116, 0.1);
            border: 1px solid rgba(212, 165, 116, 0.3);
            color: #d4a574;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back:hover {
            background: rgba(212, 165, 116, 0.2);
            transform: translateY(-2px);
        }

        .search-box {
            background: rgba(25, 25, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            background: rgba(40, 40, 45, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #e8e8e8;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #d4a574;
        }

        .permissions-grid {
            display: grid;
            gap: 1.5rem;
        }

        .module-card {
            background: rgba(25, 25, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .module-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #d4a574;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .permissions-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .permission-item {
            background: rgba(40, 40, 45, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .permission-item:hover {
            background: rgba(50, 50, 55, 0.6);
            border-color: rgba(212, 165, 116, 0.2);
        }

        .permission-info {
            flex: 1;
        }

        .permission-name {
            font-weight: 500;
            color: #e8e8e8;
            margin-bottom: 0.25rem;
        }

        .permission-desc {
            font-size: 0.85rem;
            color: #888;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            margin-left: 1rem;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, #d4a574, #b8843d);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        .permission-item.saving {
            opacity: 0.6;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #888;
        }

        .loading i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #d4a574;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(25, 25, 28, 0.95);
            border: 1px solid rgba(212, 165, 116, 0.5);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 2000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-color: rgba(76, 175, 80, 0.5);
        }

        .toast.error {
            border-color: rgba(244, 67, 54, 0.5);
        }

        .toast i {
            font-size: 1.5rem;
        }

        .toast.success i {
            color: #4caf50;
        }

        .toast.error i {
            color: #f44336;
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .page-header { flex-direction: column; gap: 1rem; padding: 1.5rem; }
            .header-left h1 { font-size: 1.5rem; }
            .btn-back { width: 100%; justify-content: center; }
            .permissions-list { grid-template-columns: 1fr; }
            .permission-item { flex-direction: column; gap: 1rem; }
            .toggle-switch { align-self: flex-end; width: 60px; height: 32px; }
            .toggle-slider:before { height: 24px; width: 24px; left: 4px; bottom: 4px; }
            input:checked + .toggle-slider:before { transform: translateX(28px); }
            .toast { left: 1rem; right: 1rem; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div class="header-left">
                <h1>
                    <i class="fas fa-edit"></i>
                    <span id="pageTitle">Editar Permissões do Perfil</span>
                </h1>
                <p id="pageSubtitle">Carregando...</p>
            </div>
            <a href="permissoes-usuario.html" class="btn-back">
                <i class="fas fa-arrow-left"></i>
                Voltar
            </a>
        </div>

        <div class="search-box">
            <input type="text" id="searchPermissao" class="search-input" placeholder="Buscar permissão por nome ou descrição...">
        </div>

        <div id="permissoesContainer" class="permissions-grid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando permissões...</p>
            </div>
        </div>
    </div>

    <script>
        let perfilAtual = {};
        let todasPermissoes = [];

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            perfilAtual = {
                codigo: urlParams.get('codigo'),
                nome: urlParams.get('nome')
            };

            document.getElementById('pageSubtitle').textContent = `Perfil: ${perfilAtual.nome}`;

            carregarPermissoes();

            // Busca em tempo real
            document.getElementById('searchPermissao').addEventListener('input', function() {
                renderizarPermissoes();
            });
        });

        async function carregarPermissoes() {
            try {
                const response = await fetch(`../../bancodedados/administrador/listar_todas_permissoes.php?perfil=${perfilAtual.codigo}`);
                const result = await response.json();

                if (result.sucesso) {
                    todasPermissoes = result.permissoes || [];
                    renderizarPermissoes();
                } else {
                    document.getElementById('permissoesContainer').innerHTML = `
                        <div class="loading">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Erro ao carregar permissões: ${result.mensagem}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('permissoesContainer').innerHTML = `
                    <div class="loading">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao carregar permissões</p>
                    </div>
                `;
            }
        }

        function renderizarPermissoes() {
            const container = document.getElementById('permissoesContainer');
            const searchTerm = document.getElementById('searchPermissao').value.toLowerCase();

            // Agrupar por módulo
            const modulos = {};
            todasPermissoes.forEach(perm => {
                if (!modulos[perm.modulo]) {
                    modulos[perm.modulo] = [];
                }
                modulos[perm.modulo].push(perm);
            });

            let html = '';

            Object.keys(modulos).sort().forEach(modulo => {
                const permissoesModulo = modulos[modulo].filter(p => {
                    if (!searchTerm) return true;
                    return p.nome.toLowerCase().includes(searchTerm) || 
                           p.descricao?.toLowerCase().includes(searchTerm);
                });

                if (permissoesModulo.length === 0) return;

                const icone = getIconeModulo(modulo);
                html += `
                    <div class="module-card">
                        <div class="module-header">
                            <h3 class="module-title">
                                <i class="${icone}"></i>
                                ${formatarNomeModulo(modulo)}
                            </h3>
                        </div>
                        <div class="permissions-list">
                `;

                permissoesModulo.forEach(perm => {
                    const pertenceAoPerfil = perm.codigo_perfil == perfilAtual.codigo;
                    html += `
                        <div class="permission-item" id="perm-${perm.codigo}">
                            <div class="permission-info">
                                <div class="permission-name">${perm.nome}</div>
                                <div class="permission-desc">${perm.descricao || 'Sem descrição'}</div>
                            </div>
                            <label class="toggle-switch">
                                <input type="checkbox" 
                                       ${pertenceAoPerfil ? 'checked' : ''} 
                                       onchange="togglePermissao(${perm.codigo}, this)">
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="loading"><p>Nenhuma permissão encontrada</p></div>';
        }

        async function togglePermissao(codigoPermissao, checkbox) {
            const permItem = document.getElementById(`perm-${codigoPermissao}`);
            const ativo = checkbox.checked;

            permItem.classList.add('saving');

            try {
                const endpoint = ativo ? 
                    '../../bancodedados/administrador/adicionar_permissao_perfil.php' :
                    '../../bancodedados/administrador/remover_permissao_perfil.php';

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        codigo_permissao: codigoPermissao,
                        codigo_perfil: perfilAtual.codigo
                    })
                });

                const result = await response.json();

                if (result.sucesso) {
                    showToast(ativo ? 'Permissão adicionada ao perfil' : 'Permissão removida do perfil', 'success');
                    // Atualizar o array local
                    const index = todasPermissoes.findIndex(p => p.codigo == codigoPermissao);
                    if (index !== -1) {
                        if (ativo) {
                            todasPermissoes[index].codigo_perfil = perfilAtual.codigo;
                        } else {
                            todasPermissoes[index].codigo_perfil = null;
                        }
                    }
                } else {
                    checkbox.checked = !ativo;
                    showToast('Erro: ' + result.mensagem, 'error');
                }
            } catch (error) {
                console.error('Erro:', error);
                checkbox.checked = !ativo;
                showToast('Erro ao atualizar permissão', 'error');
            } finally {
                permItem.classList.remove('saving');
            }
        }

        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                <span>${message}</span>
            `;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('show');
            }, 100);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }

        function getIconeModulo(modulo) {
            const icones = {
                'dashboard': 'fas fa-chart-line',
                'agendamentos': 'fas fa-calendar-alt',
                'clientes': 'fas fa-users',
                'servicos': 'fas fa-cut',
                'produtos': 'fas fa-box',
                'financeiro': 'fas fa-dollar-sign',
                'horarios': 'fas fa-clock',
                'administrador': 'fas fa-user-shield'
            };
            return icones[modulo] || 'fas fa-cog';
        }

        function formatarNomeModulo(modulo) {
            const nomes = {
                'dashboard': 'Dashboard',
                'agendamentos': 'Agendamentos',
                'clientes': 'Clientes',
                'servicos': 'Serviços',
                'produtos': 'Produtos',
                'financeiro': 'Financeiro',
                'horarios': 'Horários',
                'administrador': 'Administrador'
            };
            return nomes[modulo] || modulo.charAt(0).toUpperCase() + modulo.slice(1);
        }
    </script>
</body>
</html>
