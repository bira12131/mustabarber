<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Servi&ccedil;o - MustaBarber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="../tema-claro.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #141414 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-section h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
            color: #fff;
            box-shadow: 0 4px 12px rgba(150, 150, 170, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 150, 170, 0.4);
        }

        .btn-secondary {
            background: rgba(45, 45, 50, 0.8);
            color: #e8e8e8;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-card {
            background: rgba(25, 25, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: #e8e8e8;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-label .required {
            color: #ef4444;
            margin-left: 0.25rem;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 0.875rem;
            background: rgba(45, 45, 50, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #e8e8e8;
            font-size: 0.9rem;
            transition: all 0.3s;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            border-color: #e8e8e8;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        /* Upload de Imagem */
        .image-upload-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .image-preview {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(74, 74, 74, 0.1), rgba(42, 42, 42, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-placeholder {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .image-upload-label {
            cursor: pointer;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #e8e8e8;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .image-upload-label:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #e8e8e8;
        }

        .image-upload-input {
            display: none;
        }

        .remove-image-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s;
        }

        .image-preview.has-image .remove-image-btn {
            display: flex;
        }

        .remove-image-btn:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .form-actions .btn {
            flex: 1;
        }

        /* Modal de Recorte de Imagem */
        .crop-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .crop-modal-overlay.active {
            display: flex;
        }

        .crop-modal {
            background: #1a1a1e;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 1.5rem;
            width: 100%;
            max-width: 620px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .crop-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .crop-modal-header h3 {
            color: #e8e8e8;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .crop-container {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            max-height: 400px;
        }

        .crop-container img {
            display: block;
            max-width: 100%;
        }

        .crop-controls {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .crop-controls .btn-icon {
            padding: 0.5rem 0.75rem;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #e8e8e8;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .crop-controls .btn-icon:hover {
            background: rgba(255,255,255,0.2);
        }

        .crop-controls select {
            padding: 0.5rem 0.75rem;
            background: rgba(45,45,50,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .crop-actions {
            display: flex;
            gap: 0.75rem;
        }

        .crop-actions .btn {
            flex: 1;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-section h1 {
                font-size: 1.5rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                padding: 0.75rem 1.25rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h1 id="page-title"><i class="fas fa-plus-circle"></i> Novo Servi&ccedil;o</h1>
            <a href="servicos.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="form-card">
            <form id="serviceForm">
                <input type="hidden" id="serviceId" value="">

                <div class="form-group">
                    <label class="form-label">Imagem do Servi&ccedil;o</label>
                    <div class="image-upload-container">
                        <div class="image-preview" id="imagePreview">
                            <div class="image-preview-placeholder">
                                <i class="fas fa-cut"></i>
                            </div>
                            <button type="button" class="remove-image-btn" onclick="removeImage()">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <label for="serviceImage" class="image-upload-label">
                            <i class="fas fa-upload"></i> Escolher Imagem
                        </label>
                        <input type="file" id="serviceImage" class="image-upload-input" accept="image/*" onchange="openCropModal(event)">
                        <small style="color: #e8e8e8; font-size: 0.8rem;">
                            Formatos aceitos: JPG, PNG, GIF (M&aacute;x: 10MB)
                        </small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Nome do Servi&ccedil;o<span class="required">*</span>
                    </label>
                    <input type="text" id="serviceName" class="form-input" placeholder="Ex: Corte de Cabelo" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Descri&ccedil;&atilde;o</label>
                    <textarea id="serviceDescription" class="form-textarea" placeholder="Descreva o servi&ccedil;o (opcional)..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">
                            Pre&ccedil;o (R$)<span class="required">*</span>
                        </label>
                        <input type="number" id="servicePrice" class="form-input" placeholder="0.00" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            Dura&ccedil;&atilde;o (minutos)<span class="required">*</span>
                        </label>
                        <input type="number" id="serviceDuration" class="form-input" placeholder="30" min="1" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="servicos.html" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Salvar Servi&ccedil;o
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentImageFile = null;
        let editingServiceId = null;
        let cropperInstance = null;

        // Abre o modal de recorte ao selecionar imagem
        function openCropModal(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Validar tamanho (10MB)
            if (file.size > 10 * 1024 * 1024) {
                showNotification('A imagem deve ter no máximo 10MB', 'error');
                event.target.value = '';
                return;
            }

            // Validar tipo
            if (!file.type.startsWith('image/')) {
                showNotification('Por favor, selecione uma imagem válida', 'error');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const cropImg = document.getElementById('cropImage');
                cropImg.src = e.target.result;

                // Destruir instância anterior se existir
                if (cropperInstance) {
                    cropperInstance.destroy();
                    cropperInstance = null;
                }

                // Abrir modal
                document.getElementById('cropModalOverlay').classList.add('active');
                document.getElementById('cropAspectRatio').value = '1';

                // Inicializar Cropper.js
                cropperInstance = new Cropper(cropImg, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.9,
                    responsive: true,
                    background: true,
                    guides: true,
                    highlight: true,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: true
                });
            };
            reader.readAsDataURL(file);
        }

        // Fechar modal sem aplicar
        function closeCropModal() {
            document.getElementById('cropModalOverlay').classList.remove('active');
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            // Limpar input de arquivo se ainda não havia imagem definida
            if (!currentImageFile) {
                document.getElementById('serviceImage').value = '';
            }
        }

        // Alterar proporção do recorte
        function changeCropAspect(value) {
            if (!cropperInstance) return;
            if (value === 'free') {
                cropperInstance.setAspectRatio(NaN);
            } else {
                cropperInstance.setAspectRatio(parseFloat(value));
            }
        }

        // Aplicar o recorte e mostrar preview
        function applyCrop() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                maxWidth: 1200,
                maxHeight: 1200,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high'
            });

            canvas.toBlob(function(blob) {
                // Criar File a partir do blob
                const fileName = 'servico_' + Date.now() + '.jpg';
                currentImageFile = new File([blob], fileName, { type: 'image/jpeg' });

                // Mostrar preview recortado
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = `
                    <img src="${canvas.toDataURL('image/jpeg', 0.92)}" alt="Preview">
                    <button type="button" class="remove-image-btn" onclick="removeImage()">
                        <i class="fas fa-times"></i>
                    </button>
                `;
                preview.classList.add('has-image');

                // Fechar modal
                document.getElementById('cropModalOverlay').classList.remove('active');
                cropperInstance.destroy();
                cropperInstance = null;

                showNotification('Imagem recortada com sucesso!', 'success', 2000);
            }, 'image/jpeg', 0.92);
        }

        // Preview de imagem (mantido para compatibilidade)
        function previewImage(event) {
            openCropModal(event);
        }

        // Espelhar horizontalmente
        function flipHorizontal() {
            if (!cropperInstance) return;
            const data = cropperInstance.getData();
            const currentScaleX = data.scaleX !== undefined ? data.scaleX : 1;
            cropperInstance.scaleX(-currentScaleX);
        }

        // Remover imagem
        function removeImage() {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = `
                <div class="image-preview-placeholder">
                    <i class="fas fa-cut"></i>
                </div>
                <button type="button" class="remove-image-btn" onclick="removeImage()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            preview.classList.remove('has-image');
            document.getElementById('serviceImage').value = '';
            currentImageFile = null;
        }

        // Carregar dados do servi&ccedil;o para edi&ccedil;&atilde;o
        async function loadServiceData(codigo) {
            try {
                const response = await fetch(`../../bancodedados/servicos/listar_servicos.php?codigo=${codigo}`);
                const data = await response.json();
                
                if (data.sucesso && data.servico) {
                    const service = data.servico;
                    document.getElementById('serviceName').value = service.nome;
                    document.getElementById('serviceDescription').value = service.descricao || '';
                    document.getElementById('servicePrice').value = service.preco;
                    document.getElementById('serviceDuration').value = service.duracao;
                    
                    if (service.foto_caminho) {
                        const preview = document.getElementById('imagePreview');
                        preview.innerHTML = `
                            <img src="../../${service.foto_caminho}" alt="${service.nome}">
                            <button type="button" class="remove-image-btn" onclick="removeImage()">
                                <i class="fas fa-times"></i>
                            </button>
                        `;
                        preview.classList.add('has-image');
                    }
                } else {
                    throw new Error(data.mensagem || 'Servi&ccedil;o n&atilde;o encontrado');
                }
            } catch (error) {
                console.error('Erro ao carregar servi&ccedil;o:', error);
                showNotification(error.message || 'Erro ao carregar dados do servi&ccedil;o', 'error');
            }
        }

        // Salvar servi&ccedil;o
        document.getElementById('serviceForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('serviceName').value;
            const descricao = document.getElementById('serviceDescription').value;
            const preco = parseFloat(document.getElementById('servicePrice').value);
            const duracao = parseInt(document.getElementById('serviceDuration').value);
            
            // Validar campos obrigat&oacute;rios
            if (!nome || !preco || !duracao) {
                showNotification('Por favor, preencha todos os campos obrigat&oacute;rios', 'error');
                return;
            }

            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

            try {
                // Preparar dados para envio
                const formData = new FormData();
                formData.append('nome', nome);
                formData.append('descricao', descricao);
                formData.append('preco', preco);
                formData.append('duracao', duracao);
                
                // Adicionar c&oacute;digo do barbeiro logado
                if (window.parent && window.parent.usuarioLogado && window.parent.usuarioLogado.codigo) {
                    formData.append('codigo_barbeiro', window.parent.usuarioLogado.codigo);
                }
                
                if (currentImageFile) {
                    formData.append('imagem', currentImageFile);
                }
                
                if (editingServiceId) {
                    formData.append('codigo', editingServiceId);
                }

                const response = await fetch('../../bancodedados/servicos/cadastro_servico.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.sucesso) {
                    showNotification(editingServiceId ? 'Servi&ccedil;o atualizado com sucesso!' : 'Servi&ccedil;o cadastrado com sucesso!', 'success');
                    setTimeout(() => {
                        window.location.href = 'servicos.html';
                    }, 1500);
                } else {
                    throw new Error(data.mensagem || 'Erro ao salvar servi&ccedil;o');
                }
                
            } catch (error) {
                console.error('Erro ao salvar servi&ccedil;o:', error);
                showNotification(error.message || 'Erro ao salvar servi&ccedil;o', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });

        // Notifica&ccedil;&atilde;o
        function showNotification(message, type = 'info', duration = 3000) {
            const existing = document.querySelector('.notification');
            if (existing) {
                existing.remove();
            }
            
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.style.cssText = `
                position: fixed;
                top: 1rem;
                right: 1rem;
                background: rgba(26, 24, 22, 0.95);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(212, 165, 116, 0.3);
                border-left: 4px solid ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#d4a574'};
                color: #f5f1ed;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                z-index: 10001;
                max-width: 300px;
                animation: slideInRight 0.3s ease-in-out;
            `;
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOutRight 0.3s ease-in-out';
                setTimeout(() => notification.remove(), 300);
            }, duration);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar se est&aacute; editando
            const urlParams = new URLSearchParams(window.location.search);
            const serviceCodigo = urlParams.get('codigo');
            
            if (serviceCodigo) {
                editingServiceId = serviceCodigo;
                document.getElementById('page-title').innerHTML = '<i class="fas fa-edit"></i> Editar Servi&ccedil;o';
                document.getElementById('serviceId').value = serviceCodigo;
                loadServiceData(serviceCodigo);
            }
        });

        // Adicionar anima&ccedil;&otilde;es CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOutRight {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
    
    <!-- Modal de Recorte de Imagem -->
    <div class="crop-modal-overlay" id="cropModalOverlay">
        <div class="crop-modal">
            <div class="crop-modal-header">
                <h3><i class="fas fa-crop-alt"></i> Editar Imagem</h3>
                <button type="button" class="btn-icon" onclick="closeCropModal()" title="Fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="crop-controls">
                <button type="button" class="btn-icon" onclick="cropperInstance.rotate(-90)" title="Girar 90° para a esquerda">
                    <i class="fas fa-undo"></i> Girar
                </button>
                <button type="button" class="btn-icon" onclick="cropperInstance.rotate(90)" title="Girar 90° para a direita">
                    <i class="fas fa-redo"></i> Girar
                </button>
                <button type="button" class="btn-icon" onclick="flipHorizontal()" title="Espelhar horizontalmente">
                    <i class="fas fa-arrows-alt-h"></i> Espelhar
                </button>
                <button type="button" class="btn-icon" onclick="cropperInstance.reset()" title="Resetar">
                    <i class="fas fa-sync-alt"></i> Resetar
                </button>
                <select id="cropAspectRatio" onchange="changeCropAspect(this.value)" title="Proporção do recorte">
                    <option value="1">Quadrado (1:1)</option>
                    <option value="free">Livre</option>
                    <option value="1.7778">Paisagem (16:9)</option>
                    <option value="0.5625">Retrato (9:16)</option>
                    <option value="1.3333">4:3</option>
                </select>
            </div>

            <div class="crop-container">
                <img id="cropImage" src="" alt="Imagem para recorte">
            </div>

            <div class="crop-actions">
                <button type="button" class="btn btn-secondary" onclick="closeCropModal()">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" class="btn btn-primary" onclick="applyCrop()">
                    <i class="fas fa-check"></i> Aplicar Recorte
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script>
        // Aplicar tema salvo ao carregar p?gina
        (function() {
            const temaSalvo = localStorage.getItem('tema');
            if (temaSalvo === 'claro') {
                document.body.classList.add('tema-claro');
            }
        })();
    </script>
</body>
</html>
