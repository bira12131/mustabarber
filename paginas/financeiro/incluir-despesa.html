<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incluir Despesa - MustaBarber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="../tema-claro.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #141414 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 2rem;
        }

        .despesa-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            background: rgba(25, 25, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-content {
            flex: 1;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .page-header p {
            color: #e8e8e8;
            font-size: 1rem;
        }

        .btn-voltar {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .form-card {
            background: rgba(25, 25, 28, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #e8e8e8;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #e8e8e8;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 0.25rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.875rem;
            background: rgba(25, 25, 28, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #e8e8e8;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #6b7280;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #e8e8e8;
        }

        .input-with-icon input {
            padding-left: 2.75rem;
        }

        .input-with-icon input[type="date"] {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            padding-right: 2.25rem;
            font-size: 0.95rem;
        }

        .input-with-icon input[type="date"]::-webkit-calendar-picker-indicator {
            margin: 0;
            padding: 0;
        }

        .input-with-icon input[type="date"]::-webkit-date-and-time-value {
            text-align: left;
        }

        .form-help {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .payment-method {
            position: relative;
        }

        .payment-method input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .payment-method label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgba(25, 25, 28, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            min-height: 80px;
        }

        .payment-method input[type="radio"]:checked + label {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #ef4444;
        }

        .payment-method label:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .payment-method label i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .payment-method label span {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .status-option {
            position: relative;
        }

        .status-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .status-option label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: rgba(25, 25, 28, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-option input[type="radio"]:checked + label {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }

        .status-option label:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .status-option label i {
            font-size: 1.25rem;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            padding: 0.875rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e8e8e8;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .alert i {
            font-size: 1.25rem;
        }

        /* Responsividade Mobile */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                overflow-x: hidden;
            }

            .page-header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .input-with-icon {
                overflow: hidden;
            }

            .input-with-icon input[type="date"] {
                font-size: 0.9rem;
            }

            .payment-methods {
                grid-template-columns: repeat(2, 1fr);
            }

            .status-options {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="despesa-container">
        <!-- Cabe&ccedil;alho da P&aacute;gina -->
        <div class="page-header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-arrow-down"></i>
                    Incluir Despesa
                </h1>
                <p>Registre sa&iacute;das financeiras do seu neg&oacute;cio</p>
            </div>
            <a href="#" onclick="voltarParaGestao(event)" class="btn-voltar">
                <i class="fas fa-arrow-left"></i>
                Voltar
            </a>
        </div>

        <!-- Formul&aacute;rio -->
        <div class="form-card">
            <form id="despesaForm" onsubmit="salvarDespesa(event)">
                <!-- Informa&ccedil;&otilde;es B&aacute;sicas -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-info-circle"></i>
                        Informa&ccedil;&otilde;es B&aacute;sicas
                    </h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="data">
                                Data da Despesa
                                <span class="required">*</span>
                            </label>
                            <div class="input-with-icon">
                                <i class="fas fa-calendar input-icon"></i>
                                <input type="date" id="data" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="valor">
                                Valor (R$)
                                <span class="required">*</span>
                            </label>
                            <div class="input-with-icon">
                                <i class="fas fa-dollar-sign input-icon"></i>
                                <input type="number" id="valor" step="0.01" placeholder="0,00" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="descricao">
                            Descri&ccedil;&atilde;o
                            <span class="required">*</span>
                        </label>
                        <input type="text" id="descricao" placeholder="Ex: Aluguel do espa&ccedil;o" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">
                                Categoria
                                <span class="required">*</span>
                            </label>
                            <select id="categoria" required>
                                <option value="">Carregando...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="fornecedor">Fornecedor/Benefici&aacute;rio</label>
                            <input type="text" id="fornecedor" placeholder="Nome do fornecedor (opcional)">
                        </div>
                    </div>
                </div>

                <!-- Status do Pagamento -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-check-circle"></i>
                        Status do Pagamento
                    </h2>

                    <div class="status-options">
                        <div class="status-option">
                            <input type="radio" id="pago" name="status" value="2" checked>
                            <label for="pago">
                                <i class="fas fa-check-circle" style="color: #10b981;"></i>
                                <span>Pago</span>
                            </label>
                        </div>

                        <div class="status-option">
                            <input type="radio" id="pendente" name="status" value="1">
                            <label for="pendente">
                                <i class="fas fa-clock" style="color: #f59e0b;"></i>
                                <span>Pendente</span>
                            </label>
                        </div>

                        <div class="status-option">
                            <input type="radio" id="vencido" name="status" value="3">
                            <label for="vencido">
                                <i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>
                                <span>Vencido</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label for="dataVencimento">Data de Vencimento</label>
                        <div class="input-with-icon">
                            <i class="fas fa-calendar-times input-icon"></i>
                            <input type="date" id="dataVencimento">
                        </div>
                        <div class="form-help">
                            <i class="fas fa-info-circle"></i>
                            <span>Preencha se a despesa tiver uma data de vencimento espec&iacute;fica</span>
                        </div>
                    </div>
                </div>

                <!-- Forma de Pagamento -->
                <div class="form-section">
                    <h2 class="section-title">
                        <i class="fas fa-credit-card"></i>
                        Forma de Pagamento
                    </h2>

                    <div class="payment-methods">
                        <div class="payment-method">
                            <input type="radio" id="dinheiro" name="formaPagamento" value="1" checked>
                            <label for="dinheiro">
                                <i class="fas fa-money-bill-wave"></i>
                                <span>Dinheiro</span>
                            </label>
                        </div>

                        <div class="payment-method">
                            <input type="radio" id="cartao-credito" name="formaPagamento" value="3">
                            <label for="cartao-credito">
                                <i class="fas fa-credit-card"></i>
                                <span>Cart&atilde;o Cr&eacute;dito</span>
                            </label>
                        </div>

                        <div class="payment-method">
                            <input type="radio" id="cartao-debito" name="formaPagamento" value="2">
                            <label for="cartao-debito">
                                <i class="fas fa-credit-card"></i>
                                <span>Cart&atilde;o D&eacute;bito</span>
                            </label>
                        </div>

                        <div class="payment-method">
                            <input type="radio" id="pix" name="formaPagamento" value="4">
                            <label for="pix">
                                <i class="fas fa-qrcode"></i>
                                <span>PIX</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Bot&otilde;es de A&ccedil;&atilde;o -->
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                        <i class="fas fa-eraser"></i>
                        Limpar
                    </button>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-save"></i>
                        Salvar Despesa
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Definir data atual como padr&atilde;o e carregar categorias
        document.addEventListener('DOMContentLoaded', function() {
            const dataInput = document.getElementById('data');
            const hoje = new Date().toISOString().split('T')[0];
            dataInput.value = hoje;
            
            // Carregar categorias de despesas
            carregarCategorias();
        });

        // Fun&ccedil;&atilde;o para carregar categorias do banco
        async function carregarCategorias() {
            try {
                const response = await fetch('../../bancodedados/financeiro/buscar_categorias.php');
                const resultado = await response.json();
                
                const selectCategoria = document.getElementById('categoria');
                selectCategoria.innerHTML = '<option value="">Selecione...</option>';
                
                if (resultado.sucesso && resultado.categorias) {
                    resultado.categorias.forEach(categoria => {
                        const option = document.createElement('option');
                        option.value = categoria.codigo;
                        option.textContent = categoria.descricao;
                        selectCategoria.appendChild(option);
                    });
                } else {
                    selectCategoria.innerHTML = '<option value="">Erro ao carregar categorias</option>';
                }
            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
                const selectCategoria = document.getElementById('categoria');
                selectCategoria.innerHTML = '<option value="">Erro ao carregar categorias</option>';
            }
        }

        function voltarParaGestao(event) {
            if (event) event.preventDefault();
            
            // Se estiver dentro do iframe do sistema principal
            if (window.parent && window.parent.navegar) {
                window.parent.navegar('financeiro');
            } else {
                window.location.href = 'gestao-financeiro.html';
            }
        }

        function limparFormulario() {
            if (confirm('Deseja realmente limpar todos os campos?')) {
                document.getElementById('despesaForm').reset();
                const hoje = new Date().toISOString().split('T')[0];
                document.getElementById('data').value = hoje;
                document.getElementById('pago').checked = true;
                document.getElementById('dinheiro').checked = true;
                carregarCategorias();
            }
        }

        async function salvarDespesa(event) {
            event.preventDefault();
            
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // Desabilitar bot&atilde;o durante o salvamento
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';

            // Coletar dados do formul&aacute;rio
            const dados = {
                data: document.getElementById('data').value,
                valor: parseFloat(document.getElementById('valor').value),
                descricao: document.getElementById('descricao').value,
                categoria: parseInt(document.getElementById('categoria').value),
                fornecedor: document.getElementById('fornecedor').value || null,
                status: parseInt(document.querySelector('input[name="status"]:checked').value),
                dataVencimento: document.getElementById('dataVencimento').value || null,
                formaPagamento: parseInt(document.querySelector('input[name="formaPagamento"]:checked').value)
            };

            console.log('Salvando despesa:', dados);

            try {
                // Fazer chamada AJAX para salvar no banco de dados
                const response = await fetch('../../bancodedados/financeiro/salvar_despesa.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                
                const resultado = await response.json();

                if (!resultado.sucesso) {
                    throw new Error(resultado.mensagem || 'Erro ao salvar despesa');
                }

                // Sucesso
                submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Despesa salva!';

                // Mostrar mensagem de sucesso
                const alert = document.createElement('div');
                alert.className = 'alert alert-success';
                alert.innerHTML = `
                    <i class="fas fa-check-circle"></i>
                    <span>${resultado.mensagem}</span>
                `;
                document.querySelector('.form-card').insertBefore(alert, document.querySelector('form'));

                // Redirecionar ap&oacute;s 1.5 segundos
                setTimeout(() => {
                    voltarParaGestao();
                }, 1500);

            } catch (error) {
                console.error('Erro ao salvar:', error);
                
                // Mostrar erro
                const alert = document.createElement('div');
                alert.className = 'alert alert-error';
                alert.innerHTML = `
                    <i class="fas fa-exclamation-circle"></i>
                    <span>Erro ao salvar a despesa. Tente novamente.</span>
                `;
                document.querySelector('.form-card').insertBefore(alert, document.querySelector('form'));

                // Restaurar bot&atilde;o
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;

                // Remover alerta ap&oacute;s 5 segundos
                setTimeout(() => alert.remove(), 5000);
            }
        }

        // Formata&ccedil;&atilde;o do valor monet&aacute;rio
        document.getElementById('valor').addEventListener('blur', function(e) {
            if (this.value) {
                this.value = parseFloat(this.value).toFixed(2);
            }
        });
    </script>
    
    <script>
        // Aplicar tema salvo ao carregar p&aacute;gina
        (function() {
            const temaSalvo = localStorage.getItem('tema');
            if (temaSalvo === 'claro') {
                document.body.classList.add('tema-claro');
            }
        })();
    </script>
</body>
</html>
